<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container py-5">

    <div class="card shadow-lg p-4 form-card">

        <h2 class="mb-4 text-center">Update Task</h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Title</label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    value="{{ task.title }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="3"
                    required
                >{{ task.description }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Priority</label>

                <select name="priority" class="form-select">

                    <option value="High"
                    {% if task.priority == 'High' %}selected{% endif %}>
                    High
                    </option>

                    <option value="Medium"
                    {% if task.priority == 'Medium' %}selected{% endif %}>
                    Medium
                    </option>

                    <option value="Low"
                    {% if task.priority == 'Low' %}selected{% endif %}>
                    Low
                    </option>

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>

                <select name="status" class="form-select">

                    <option value="Pending"
                    {% if task.status == 'Pending' %}selected{% endif %}>
                    Pending
                    </option>

                    <option value="Completed"
                    {% if task.status == 'Completed' %}selected{% endif %}>
                    Completed
                    </option>

                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Update Task
            </button>

        </form>

    </div>

</div>

</body>
</html>
